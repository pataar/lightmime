<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="256" viewBox="0 0 1100 256">
  <title>lightmime</title>
  <defs>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A3D"/>
      <stop offset="0.35" stop-color="#F0479B"/>
      <stop offset="0.68" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#22C7E8"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1D33"/>
      <stop offset="1" stop-color="#0C0D18"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="tile">
      <rect x="8" y="8" width="240" height="240" rx="56"/>
    </clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#night)"/>
  <g clip-path="url(#tile)">
    <!-- the light the screen casts on the wall behind it -->
    <rect x="36" y="62" width="184" height="124" rx="30" fill="url(#spectrum)" opacity="0.85" filter="url(#glow)"/>
  </g>
  <rect x="56" y="78" width="144" height="92" rx="14" fill="#0C0D18"/>
  <rect x="62" y="84" width="132" height="80" rx="9" fill="url(#spectrum)"/>
  <rect x="62" y="84" width="132" height="80" rx="9" fill="url(#sheen)"/>
  <!-- wordmark: monoline strokes, x-height 40, stroke 9, scaled 1.8x -->
  <g transform="translate(300 52) scale(1.8)">
    <g fill="none" stroke="#F4F2FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0V64 M20 24V64 M80 24V68A20 20 0 0 1 60 88H50 M100 0V64M100 44A20 20 0 0 1 140 44V64 M160 8V52A12 12 0 0 0 172 64H178M150 24H176 M194 24V64M194 40A16 16 0 0 1 226 40V64M226 40A16 16 0 0 1 258 40V64 M278 24V64 M298 24V64M298 40A16 16 0 0 1 330 40V64M330 40A16 16 0 0 1 362 40V64 M382 44H422A20 20 0 1 0 416.1 58.1 "/>
      <circle cx="60" cy="44" r="20"/>
    </g>
    <circle cx="20" cy="8" r="6.5" fill="#FF7A3D"/>
    <circle cx="278" cy="8" r="6.5" fill="#22C7E8"/>
  </g>
</svg>
