<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <title>lightmime</title>
  <!-- Small-size variant of scalable/apps/lightmime.svg: every edge on the 16 px grid, the blurred glow as a flat halo. -->
  <defs>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A3D"/>
      <stop offset="0.35" stop-color="#F0479B"/>
      <stop offset="0.68" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#22C7E8"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1D33"/>
      <stop offset="1" stop-color="#0C0D18"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="16" height="16" rx="3.5" fill="url(#night)"/>
  <rect x="2" y="4" width="12" height="8" rx="2" fill="url(#spectrum)" opacity="0.45"/>
  <rect x="3" y="5" width="10" height="6" rx="1" fill="#0C0D18"/>
  <rect x="4" y="6" width="8" height="4" fill="url(#spectrum)"/>
  <rect x="4" y="6" width="8" height="4" fill="url(#sheen)"/>
</svg>
