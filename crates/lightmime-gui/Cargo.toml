[package]
name = "lightmime-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The lightmime window and tray icon"

[dependencies]
anyhow = "1.0.104"
# async-io to match gpui and lightmime-core (see there).
ashpd = { version = "0.13.13", default-features = false, features = ["background", "async-io"] }
dirs = "7.0.0"
# The crates.io `gpui` 0.2 no longer builds against current libc; gpui-pre is a newer snapshot of Zed's gpui.
gpui = { package = "gpui-pre", version = "0.3.10" }
# Wayland is the main target; X11 comes for free.
gpui_platform = { package = "gpui-pre-platform", version = "0.3.10", default-features = false, features = ["wayland", "x11"] }
ksni = "0.3.7"
lightmime-core = { version = "0.1.2", path = "../lightmime-core" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "0.3.10", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.10", default-features = false, features = ["wayland", "x11", "test-support"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = "1.0.154"
