[package]
name = "lightmime-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.13.13", features = ["screencast", "tokio"] }
dirs = "7.0.0"
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.4"
openssl = "0.10.81"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
toml = "1.1.8"
tracing = "0.1.44"
