[package]
name = "lightmime-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Screen capture, colour mapping and Hue Entertainment streaming for lightmime"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
# async-io rather than tokio: gpui uses ashpd with async-io, and Cargo unifies the two into one build that refuses both.
ashpd = { version = "0.13.13", default-features = false, features = ["screencast", "async-io"] }
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.4"
openssl = "0.10.81"
# native-tls: OpenSSL is linked for the DTLS stream anyway, so no second TLS stack (rustls + aws-lc). No HTTP/2 or ALPN: the bridge and discovery speak HTTP/1.1 fine.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls-no-alpn", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
