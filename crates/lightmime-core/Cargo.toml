[package]
name = "lightmime-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Screen capture, colour mapping and Hue Entertainment streaming for lightmime"
publish = false

[dependencies]
anyhow = "1.0.104"
# async-io rather than tokio: gpui uses ashpd with async-io, and Cargo unifies the two into one build that refuses both.
ashpd = { version = "0.13.13", default-features = false, features = ["screencast", "async-io"] }
dirs = "7.0.0"
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.4"
openssl = "0.10.81"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
toml = "1.1.8"
tracing = "0.1.44"
