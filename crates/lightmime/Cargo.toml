[package]
name = "lightmime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
description = "Sync Philips Hue lights with your screen on Linux"

[features]
default = ["gui"]
# The window and tray icon (`lightmime gui`). Without it the binary is the CLI and daemon only.
gui = ["dep:lightmime-gui"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
hostname = "0.4.2"
lightmime-core = { version = "0.1.0", path = "../lightmime-core" }
lightmime-gui = { version = "0.1.0", path = "../lightmime-gui", optional = true }
openssl = "0.10.81"
# OpenSSL is linked for the DTLS stream anyway; rustls would add a second TLS stack.
rumqttc = { version = "0.25.1", default-features = false, features = ["use-native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
toml = "1.1.8"
# Writes the config back without losing the user's comments and layout.
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
