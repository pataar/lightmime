name: Release-plz

on:
  # Every push to main tags what a merged release PR bumped, and refreshes the release PR, so it always holds
  # everything merged; each refresh runs CI on it.
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Tag
    if: github.repository_owner == 'pataar' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # cargo publish (verify) and cargo-semver-checks compile the crates, which link GStreamer and glib.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $(cat packaging/linux/build-deps-apt.txt)
      - run: rustup toolchain install
      - uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5.146
        with:
          command: release
        env:
          # A tag pushed with the default GITHUB_TOKEN would not start release.yml.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-pr:
    name: Release PR
    if: github.repository_owner == 'pataar'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # cargo publish (verify) and cargo-semver-checks compile the crates, which link GStreamer and glib.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $(cat packaging/linux/build-deps-apt.txt)
      - run: rustup toolchain install
      - uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5.146
        with:
          command: release-pr
        env:
          # PRs opened with the default GITHUB_TOKEN would not run CI.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
