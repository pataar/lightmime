name: Docs

on:
  push:
    branches: [main]
    paths: [.github/workflows/docs.yml, assets/**, docs/**, packaging/linux/flatpak-repo.sh]
  pull_request:
    paths: [.github/workflows/docs.yml, docs/**]
  # release.yml starts this once a release's bundles are attached, so the Flatpak repository gets them.
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: mdbook
      - run: docs/build.sh
      # Every deploy replaces the whole site, so each one carries the Flatpak repository as well.
      - name: Add the Flatpak repository
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: https://lightmime.pataar.nl
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends flatpak ostree
          packaging/linux/flatpak-repo.sh docs/book
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: docs/book

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
