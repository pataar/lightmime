# Builds the release binaries and Flatpak bundles for x86_64 and aarch64 and publishes them as a GitHub release when a
# version tag is pushed. A pull request that touches packaging runs the same build without publishing.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
    paths:
      - packaging/linux/**
      - assets/icons/**
      - contrib/*.desktop
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ "v$version" = "$TAG" ] || { echo "tag $TAG does not match Cargo.toml version $version" >&2; exit 1; }
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $(cat packaging/linux/build-deps-apt.txt) flatpak flatpak-builder elfutils librsvg2-bin
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ startsWith(github.ref, 'refs/tags/') }}
      - run: cargo build --release --locked -p lightmime
      - name: Package the binary
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          name=lightmime-$ARCH-unknown-linux-gnu
          mkdir -p "dist/$name"
          cp target/release/lightmime README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cp -r contrib "dist/$name/"
          tar -C dist -cJf "dist/$name.tar.xz" "$name"
          rm -r "dist/$name"
      - name: Build the Flatpak bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: packaging/linux/flatpak.sh target/release/lightmime "$ARCH" "$PWD/dist/lightmime-$ARCH.flatpak"
      - name: Smoke test the Flatpak
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          flatpak install --user -y --noninteractive "dist/lightmime-$ARCH.flatpak"
          dbus-run-session -- flatpak run io.github.pataar.lightmime --version
          dbus-run-session -- flatpak run io.github.pataar.lightmime --help >/dev/null
          flatpak info --user io.github.pataar.lightmime | grep -q "Branch: stable"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write # build provenance for the files below
      contents: write
      id-token: write
      # To start docs.yml, which adds the new bundles to the Flatpak repository on the site.
      actions: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          for file in *; do sha256sum "$file" >"$file.sha256"; done
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes ./*
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main
