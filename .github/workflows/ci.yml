name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Fails on any warning from our crates: rustc, clippy, rustdoc and Cargo's own lints (unused dependencies).
  CARGO_BUILD_WARNINGS: deny

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $(cat packaging/linux/build-deps-apt.txt)
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features
      # The headless build (no window or tray) must keep compiling.
      - run: cargo clippy -p lightmime --no-default-features
      # docs.rs builds the library docs; broken links and bad markdown fail here first.
      - run: cargo doc --no-deps --all-features
      - run: cargo test --all-features
