version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      # gpui-pre and its platform crates are one snapshot of Zed and must move together.
      gpui:
        patterns: ["gpui-pre*"]
      cargo:
        update-types: [minor, patch]
    ignore:
      # gpui-pre, ksni, accesskit, notify-rust and oo7 still use zbus 5 and ashpd 0.13; bumping ours alone builds
      # both majors of each. Lift this once gpui-pre and ksni are on zbus 6.
      - dependency-name: zbus
        update-types: ["version-update:semver-major"]
      - dependency-name: ashpd
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
